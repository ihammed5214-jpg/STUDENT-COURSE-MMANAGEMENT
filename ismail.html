<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Course Management</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 15px; margin: 0; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        input, button { width: 100%; padding: 10px; margin: 5px 0; box-sizing: border-box; border-radius: 4px; border: 1px solid #ccc; font-size: 16px; }
        button { background-color: #0056b3; color: white; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background-color: #004494; }
        .btn-group { display: flex; gap: 10px; }
        .btn-group button { margin-top: 10px; }

        /* Clear Button Style */
        .clear-btn { background-color: #757575; margin-top: 5px; }
        .clear-btn:hover { background-color: #616161; }

        /* --- POP-UP MODAL STYLES --- */
        .modal {
            display: none; 
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5); 
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            width: 80%;
            max-width: 400px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            text-align: center;
        }
        .modal-content h3 { margin-top: 0; color: #0056b3; }
        #popupText { font-family: monospace; white-space: pre-wrap; font-size: 15px; margin: 15px 0; text-align: left; background: #f9f9f9; padding: 10px; border-radius: 4px;}
        
        /* Modal Buttons Layout */
        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .modal-buttons button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .ok-btn { background-color: #4CAF50; color: white; }
        .ok-btn:hover { background-color: #45a049; }
        
        .cancel-btn { background-color: #f44336; color: white; }
        .cancel-btn:hover { background-color: #d32f2f; }
        
        .error { color: red; font-weight: bold; }
        .success { color: green; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Student Course Manager</h2>
    
    <input type="text" id="courseCode" placeholder="Course Code (e.g. COS201)">
    <input type="text" id="courseTitle" placeholder="Course Title (e.g. Java)">
    <input type="number" id="courseUnits" placeholder="Units (1-12)">
    
    <!-- Cancel / Clear Input Button -->
    <button class="clear-btn" onclick="clearInputs()">Cancel / Clear Inputs</button>
    
    <div class="btn-group" style="margin-top: 15px;">
        <button onclick="addCourse()">1. Add Course</button>
        <button onclick="viewAll()">2. View All</button>
    </div>
    <div class="btn-group">
        <button onclick="searchCourse()">3. Search Code</button>
        <button onclick="computeUnits()">4. Total Units</button>
    </div>
    <div class="btn-group">
        <button onclick="saveData()">5. Save</button>
        <button onclick="loadData()">6. Load</button>
    </div>
</div>

<!-- THE POP-UP MODAL -->
<div id="popupModal" class="modal">
    <div class="modal-content">
        <h3 id="popupTitle">System Message</h3>
        <div id="popupText"></div>
        
        <!-- OK and Cancel Buttons inside the popup -->
        <div class="modal-buttons">
            <button class="cancel-btn" onclick="closePopup()">Cancel</button>
            <button class="ok-btn" onclick="closePopup()">OK</button>
        </div>
    </div>
</div>

<script>
    class Course {
        constructor(code, title, units) {
            if (!code.trim()) throw new Error("Course code cannot be empty.");
            if (!title.trim()) throw new Error("Course title cannot be empty.");
            if (isNaN(units) || units < 1 || units > 12) throw new Error("Units must be between 1 and 12.");
            
            this.code = code.trim().toUpperCase();
            this.title = title.trim();
            this.units = Number(units);
        }
    }

    class CourseManager {
        constructor() {
            this.courses = [];
        }

        add(course) {
            let exists = this.courses.find(c => c.code === course.code);
            if (exists) throw new Error("DuplicateCourseError: Course already exists!");
            this.courses.push(course);
        }

        searchRecursive(code, index = 0) {
            if (index >= this.courses.length) return null;
            if (this.courses[index].code === code.trim().toUpperCase()) return this.courses[index];
            return this.searchRecursive(code, index + 1);
        }

        totalUnitsRecursive(index = 0) {
            if (index >= this.courses.length) return 0;
            return this.courses[index].units + this.totalUnitsRecursive(index + 1);
        }
    }

    const manager = new CourseManager();

    // --- POPUP CONTROLS ---
    function showPopup(title, message, isError = false) {
        document.getElementById('popupTitle').innerText = title;
        document.getElementById('popupText').innerHTML = isError 
            ? `<span class="error">${message}</span>` 
            : `<span class="success">${message}</span>`;
        document.getElementById('popupModal').style.display = 'flex';
    }

    function closePopup() {
        document.getElementById('popupModal').style.display = 'none';
    }

    function clearInputs() {
        document.getElementById('courseCode').value = '';
        document.getElementById('courseTitle').value = '';
        document.getElementById('courseUnits').value = '';
    }

    // --- APP FUNCTIONS ---
    function addCourse() {
        try {
            let code = document.getElementById('courseCode').value;
            let title = document.getElementById('courseTitle').value;
            let units = document.getElementById('courseUnits').value;

            let newCourse = new Course(code, title, units);
            manager.add(newCourse);
            
            showPopup("Success", `Added: ${newCourse.code} - ${newCourse.title}`);
            clearInputs();
        } catch (e) {
            showPopup("Error", e.message, true);
        }
    }

    function viewAll() {
        if (manager.courses.length === 0) {
            showPopup("Course List", "No courses added yet.", true);
            return;
        }
        let text = "CODE\tTITLE\tUNITS\n-------------------------\n";
        manager.courses.forEach(c => {
            text += `${c.code}\t${c.title}\t${c.units}\n`;
        });
        showPopup("All Courses", text);
    }

    function searchCourse() {
        let code = document.getElementById('courseCode').value;
        if (!code) {
            showPopup("Search Error", "Please type a course code to search.", true);
            return;
        }
        let found = manager.searchRecursive(code);
        if (found) {
            showPopup("Course Found", `${found.code} - ${found.title} (${found.units} units)`);
        } else {
            showPopup("Not Found", `Course ${code.toUpperCase()} does not exist.`, true);
        }
    }

    function computeUnits() {
        let total = manager.totalUnitsRecursive();
        showPopup("Total Units", `You have registered for ${total} credit units in total.`);
    }

    function saveData() {
        localStorage.setItem('savedCourses', JSON.stringify(manager.courses));
        showPopup("Saved", "Data successfully saved to browser memory!");
    }

    function loadData() {
        let saved = localStorage.getItem('savedCourses');
        if (!saved) {
            showPopup("Load Error", "No saved data found.", true);
            return;
        }
        let parsed = JSON.parse(saved);
        manager.courses = parsed.map(c => new Course(c.code, c.title, c.units));
        showPopup("Loaded", `Successfully loaded ${manager.courses.length} courses!`);
    }
</script>

</body>
</html>
